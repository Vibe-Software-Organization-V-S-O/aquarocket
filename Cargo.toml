[package]
name = "aquarocket"
version = "0.1.0"
edition = "2021"

[lib]
name = "aquarocket"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "aquarocket"
path = "src/main.rs"

[dependencies]
glam = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
cbindgen = "0.27"
